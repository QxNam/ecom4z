spring:
  application:
    name: order-service
    
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka-1:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      enable-auto-commit: false

app:
  kafka:
    topics:
      orderEvents: order.events.v1

  outbox:
    enabled: true
    poll-interval-ms: 500
    batch-size: 200

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
