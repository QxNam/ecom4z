volumes:
  kafka-data-1:
    name: kafka-data-1
  kafka-data-2:
    name: kafka-data-2
  kafka-data-3:
    name: kafka-data-3
  redis-data:
    name: redis-data
  pg_identity:
    name: pg_identity
  pg_order:
    name: pg_order
  pg_inventory:
    name: pg_inventory
  pg_payment:
    name: pg_payment

networks:
  kafka-net:
    driver: bridge