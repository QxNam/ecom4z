# -------------------------
# Core
# -------------------------
listen_addresses = '*'
port = 5432

# -------------------------
# Locale / Timezone
# -------------------------
timezone = 'UTC'
log_timezone = 'UTC'
# Encoding thường set ngay khi init DB; nhưng vẫn để rõ
client_encoding = 'UTF8'

# -------------------------
# Connections
# -------------------------
max_connections = 200

# -------------------------
# Memory (dev-friendly)
# -------------------------
shared_buffers = 256MB
work_mem = 8MB
maintenance_work_mem = 64MB
effective_cache_size = 768MB

# -------------------------
# WAL / Checkpoints (dev)
# -------------------------
checkpoint_timeout = 10min
max_wal_size = 1GB
min_wal_size = 80MB

# -------------------------
# Logging (debug)
# -------------------------
logging_collector = on
log_destination = 'stderr'
log_line_prefix = '%m [%p] %u@%d '
log_min_duration_statement = 200ms   # log query > 200ms
log_statement = 'none'
log_connections = on
log_disconnections = on
